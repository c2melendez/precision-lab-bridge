openapi: 3.1.0
info:
  title: Precision Lab Bridge Command API
  version: 1.0.0
  summary: Authenticated durable command intake and live Observer context.
  description: >
    M1 accepts and records typed commands only. It does not apply patches,
    dispatch GitHub Actions, create commits or pull requests. Server credentials
    remain server-side. Exact retries return the original owner-scoped receipt.
servers:
  - url: https://precision-lab-bridge.onrender.com
security:
  - BridgeKey: []
paths:
  /api/v1/capabilities:
    get:
      operationId: getBridgeCapabilities
      summary: Discover supported command types, required scopes and execution state.
      responses:
        "200":
          description: Authenticated capabilities.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        "401": { description: Missing or invalid Bridge key. }
        "403": { description: context:read scope required. }
  /api/v1/context/status:
    get:
      operationId: getObserverContextStatus
      summary: Read live repository status from Observer through Bridge.
      parameters:
        - in: query
          name: repo
          schema: { type: string, enum: [lite, plus, both], default: both }
      responses:
        "200": { description: Live Observer status. }
        "400": { description: Invalid repository selector. }
        "401": { description: Missing or invalid Bridge key. }
        "403": { description: context:read scope required. }
        "502": { description: Observer returned an invalid or unsuccessful response. }
        "503": { description: Observer unavailable or not configured. }
  /api/v1/context/gates/{gate}/plan:
    get:
      operationId: getObserverGatePlan
      summary: Read a live, non-dispatching gate plan from Observer.
      parameters:
        - in: path
          name: gate
          required: true
          schema: { type: string, minLength: 1, maxLength: 100, pattern: "^[A-Za-z0-9._-]+$" }
        - in: query
          name: repo
          required: true
          schema: { type: string, enum: [lite, plus] }
      responses:
        "200": { description: Read-only gate plan; action_taken is false. }
        "400": { description: Invalid gate or repository selector. }
        "401": { description: Missing or invalid Bridge key. }
        "403": { description: context:read scope required. }
        "502": { description: Observer returned an invalid or unsuccessful response. }
        "503": { description: Observer unavailable or not configured. }
  /api/v1/commands:
    post:
      operationId: submitBridgeCommand
      summary: Validate and durably accept a typed repository command.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
            pattern: "^[A-Za-z0-9._:-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandEnvelope" }
      responses:
        "202":
          description: New command durably accepted; execution_enabled is false.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandReceipt" }
        "200":
          description: Exact idempotent replay; same command ID and receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandReceipt" }
        "400": { description: Malformed JSON, envelope or idempotency header. }
        "401": { description: Missing or invalid Bridge key. }
        "403": { description: command:submit scope required. }
        "409": { description: Idempotency fingerprint conflict, stale HEAD or Observer reconciliation required. }
        "413": { description: Request exceeds the maximum body size. }
        "422": { description: Invalid command-specific payload or protected path. }
        "503": { description: Command store unavailable. }
  /api/v1/commands/{id}:
    get:
      operationId: getBridgeCommand
      summary: Read the authenticated caller's own command receipt.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Owner-scoped command receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandReceipt" }
        "401": { description: Missing or invalid Bridge key. }
        "403": { description: command:read scope required. }
        "404": { description: Unknown command or command owned by another key. }
        "503": { description: Command store unavailable. }
  /api/v1/commands/lookup:
    get:
      operationId: lookupBridgeCommand
      summary: Reconcile an ambiguous submission using its original idempotency key.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Owner-scoped durable receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandReceipt" }
        "400": { description: Missing or malformed Idempotency-Key. }
        "401": { description: Missing or invalid Bridge key. }
        "403": { description: command:read scope required. }
        "404": { description: Unknown command or command owned by another key. }
        "503": { description: Command store unavailable. }
components:
  securitySchemes:
    BridgeKey:
      type: apiKey
      in: header
      name: X-Bridge-Key
  schemas:
    Capabilities:
      type: object
      required: [api_version, authentication, supported_commands, required_scopes, transports, execution_enabled]
      properties:
        api_version: { type: string }
        authentication: { const: X-Bridge-Key }
        supported_commands:
          type: array
          items: { type: string, enum: [repo.inspect, repo.patch, repo.validate] }
        required_scopes:
          type: object
          properties:
            context: { const: context:read }
            submit: { const: command:submit }
            command_receipts: { const: command:read }
        transports:
          type: array
          items: { type: string }
        execution_enabled: { type: boolean, const: false }
    CommandEnvelope:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - command_type
        - target_repo
        - expected_branch
        - expected_sha
        - payload
        - idempotency_key
        - correlation_id
        - validation_id
      properties:
        schema_version: { type: integer, const: 1 }
        command_type: { type: string, enum: [repo.inspect, repo.patch, repo.validate] }
        target_repo: { type: string, enum: [lite, plus] }
        expected_branch:
          type: string
          minLength: 1
          maxLength: 255
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
        expected_sha: { type: string, pattern: "^[a-fA-F0-9]{40}$" }
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "^[A-Za-z0-9._:-]+$"
        correlation_id:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "^[A-Za-z0-9._:-]+$"
        validation_id:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "^[A-Za-z0-9._:-]+$"
        payload:
          oneOf:
            - type: object
              additionalProperties: false
              maxProperties: 0
            - type: object
              additionalProperties: false
              required: [profile]
              properties:
                profile: { type: string, enum: [unit, lint, typecheck, build] }
            - type: object
              additionalProperties: false
              required: [operations]
              properties:
                operations:
                  type: array
                  minItems: 1
                  maxItems: 40
                  items:
                    oneOf:
                      - type: object
                        additionalProperties: false
                        required: [action, path, content]
                        properties:
                          action: { const: create }
                          path: { type: string, minLength: 1, maxLength: 300 }
                          content: { type: string, maxLength: 65536 }
                      - type: object
                        additionalProperties: false
                        required: [action, path, content, expected_blob_sha]
                        properties:
                          action: { const: replace }
                          path: { type: string, minLength: 1, maxLength: 300 }
                          content: { type: string, maxLength: 65536 }
                          expected_blob_sha: { type: string, pattern: "^[a-fA-F0-9]{40}$" }
                      - type: object
                        additionalProperties: false
                        required: [action, path, expected_blob_sha]
                        properties:
                          action: { const: delete }
                          path: { type: string, minLength: 1, maxLength: 300 }
                          expected_blob_sha: { type: string, pattern: "^[a-fA-F0-9]{40}$" }
    CommandReceipt:
      type: object
      required: [command_id, command_type, target_repo, expected_branch, expected_sha, status, correlation_id, validation_id, created_at, updated_at, replay_count, execution_enabled]
      properties:
        command_id: { type: string, format: uuid }
        command_type: { type: string, enum: [repo.inspect, repo.patch, repo.validate] }
        target_repo: { type: string, enum: [lite, plus] }
        expected_branch: { type: string }
        expected_sha: { type: string, pattern: "^[a-f0-9]{40}$" }
        status:
          type: string
          enum: [accepted, queued, validating, running, awaiting_review, completed, failed, blocked, reconcile_required]
        correlation_id: { type: string }
        validation_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        replay_count: { type: integer, minimum: 0 }
        execution_enabled: { type: boolean, const: false }
        error_code: { type: string }
        actions_run_id: { type: string }
        commit_sha: { type: string }
        pull_request_number: { type: integer }
        pull_request_url: { type: string, format: uri }
