name: Qwen3 CB1-CB10 remote campaign

on:
  push:
    branches:
      - feat/cb1-cb10-groq-provider
    paths:
      - .github/workflows/qwen3-cb-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen3-cb1-cb10-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  qwen3-campaign:
    name: Qwen3 4B via Ollama — CB1-CB10 paired at source SHA (3 repetitions)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact benchmark source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 8ed4ea3b57451f35985a2123f12ed354d6b28d1e

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "22.12.0"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run benchmark and comparator unit tests
        run: bun run llm:benchmark:test

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama daemon
        shell: bash
        run: |
          OLLAMA_HOST=127.0.0.1:11434 nohup ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama API is ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ollama.log
          echo "::error::Ollama did not become ready."
          exit 1

      - name: Pull Qwen3 4B model
        run: ollama pull qwen3:4b

      - name: Run isolated Qwen3 CB1-CB10 campaign
        run: bun run llm:benchmark
        env:
          LLM_PROVIDER: ollama
          OLLAMA_MODEL: qwen3:4b
          LLM_BENCHMARK_RUNS: "3"
          LLM_BENCHMARK_OUTPUT_DIR: artifacts/llm-benchmark/qwen3-4b
          LLM_BENCHMARK_HOST_ID: github-actions-ollama-qwen3-4b
          SOURCE_SHA: 8ed4ea3b57451f35985a2123f12ed354d6b28d1e

      - name: Upload Qwen3 campaign evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen3-cb1-cb10-${{ github.run_id }}
          path: artifacts/llm-benchmark/qwen3-4b/
          if-no-files-found: ignore
          retention-days: 14
