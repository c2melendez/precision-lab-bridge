name: Bridge Observer upstream diagnostic checks

on:
  push:
    branches:
      - hardening/secure-status-independent-runtime
    paths:
      - .github/workflows/observer-upstream-diagnostic-ci.yml
      - src/lib/bridge/observer.server.ts
      - src/lib/bridge/observer.server.test.ts
      - package.json
      - bun.lock
      - .bun-version
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observer-upstream-diagnostic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Observer diagnostics tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "22.12.0"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run Bridge test suite
        run: bun run test

      - name: Run ESLint
        run: bun run lint

      - name: Build Node.js production bundle
        run: bun run build
