name: Bridge CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "22.12.0"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit and regression tests
        run: bun run test

      - name: Run ESLint
        run: bun run lint

      - name: Build Node.js production bundle
        run: bun run build

  migration-validation:
    name: Supabase migration chain (disposable local DB)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Generate timestamped migration with Supabase CLI
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new bridge_security_ownership_and_rpc_integrity
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_bridge_security_ownership_and_rpc_integrity.sql' -print -quit)"
          test -n "$migration_file"
          cp docs/sql/bridge_security_integrity.pending.sql "$migration_file"
          echo "migration_file=$migration_file" >> "$GITHUB_OUTPUT"
          echo "Generated migration: $migration_file"

      - name: Start disposable local Supabase stack
        run: supabase start

      - name: Replay complete migration history on clean local database
        run: supabase db reset

      - name: Assert reconstructed RPC security and schema constraints
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$db_container"
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE
            signatures text[] := ARRAY[
              'bridge_claim(text,uuid,text,jsonb,text,text,text,text,text)',
              'bridge_prepare(uuid,uuid)',
              'bridge_begin_dispatch(uuid,uuid,text)',
              'bridge_record_dispatch(uuid,uuid,jsonb)',
              'bridge_finish(uuid,uuid,text,integer,jsonb,text)'
            ];
            signature text;
            function_oid oid;
            matched integer;
            constraint_definition text;
          BEGIN
            FOREACH signature IN ARRAY signatures LOOP
              function_oid := to_regprocedure('public.' || signature);
              IF function_oid IS NULL THEN
                RAISE EXCEPTION 'Missing RPC: %', signature;
              END IF;
              IF EXISTS (
                SELECT 1 FROM pg_proc p
                WHERE p.oid = function_oid
                  AND (p.prosecdef OR NOT (p.proconfig @> ARRAY['search_path=public']))
              ) THEN
                RAISE EXCEPTION 'RPC must be SECURITY INVOKER with search_path=public: %', signature;
              END IF;
              IF has_function_privilege('anon', function_oid, 'EXECUTE')
                OR has_function_privilege('authenticated', function_oid, 'EXECUTE')
                OR NOT has_function_privilege('service_role', function_oid, 'EXECUTE') THEN
                RAISE EXCEPTION 'Unexpected RPC grants: %', signature;
              END IF;
            END LOOP;

            SELECT count(*) INTO matched
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='public'
              AND c.relname = ANY(ARRAY['bridge_keys','bridge_runs','bridge_calls','bridge_idempotency'])
              AND c.relrowsecurity;
            IF matched <> 4 THEN RAISE EXCEPTION 'RLS must be enabled on all four Bridge tables'; END IF;

            SELECT count(*) INTO matched
            FROM pg_policies
            WHERE schemaname='public'
              AND tablename = ANY(ARRAY['bridge_keys','bridge_runs','bridge_calls','bridge_idempotency']);
            IF matched <> 0 THEN RAISE EXCEPTION 'Unexpected public policies found on private Bridge tables'; END IF;

            IF has_table_privilege('anon','public.bridge_keys','SELECT')
              OR has_table_privilege('authenticated','public.bridge_keys','SELECT')
              OR NOT has_table_privilege('service_role','public.bridge_keys','SELECT') THEN
              RAISE EXCEPTION 'Unexpected bridge_keys SELECT grants';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_attribute
              WHERE attrelid='public.bridge_runs'::regclass AND attname='key_id'
                AND attnotnull AND NOT attisdropped
            ) THEN RAISE EXCEPTION 'bridge_runs.key_id must be NOT NULL'; END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid='public.bridge_runs'::regclass
                AND conname='bridge_runs_key_id_fkey' AND contype='f' AND convalidated
            ) THEN RAISE EXCEPTION 'Missing validated bridge_runs ownership FK'; END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid='public.bridge_idempotency'::regclass
                AND conname='bridge_idempotency_key_id_fkey' AND contype='f' AND convalidated
            ) THEN RAISE EXCEPTION 'Missing validated bridge_idempotency ownership FK'; END IF;

            SELECT pg_get_constraintdef(oid) INTO constraint_definition
            FROM pg_constraint
            WHERE conrelid='public.bridge_idempotency'::regclass
              AND conname='bridge_idempotency_key_scope_unique' AND contype='u';
            IF constraint_definition IS NULL
              OR constraint_definition NOT LIKE '%(key_id, idempotency_key)%' THEN
              RAISE EXCEPTION 'Missing composite idempotency uniqueness constraint';
            END IF;

            SELECT pg_get_constraintdef(oid) INTO constraint_definition
            FROM pg_constraint
            WHERE conrelid='public.bridge_keys'::regclass
              AND conname='bridge_keys_scopes_valid' AND contype='c';
            IF constraint_definition IS NULL
              OR constraint_definition NOT LIKE '%cardinality%'
              OR constraint_definition NOT LIKE '%dispatch%' THEN
              RAISE EXCEPTION 'Missing strict Bridge key scopes constraint';
            END IF;
          END
          $verify$;
          SQL

      - name: Lint local database functions and schema
        run: supabase db lint --level warning --fail-on error

      - name: Stop disposable local stack
        if: always()
        run: supabase stop --no-backup

      - name: Upload CLI-generated migration for review
        if: always() && steps.migration.outputs.migration_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: bridge-security-migration
          path: ${{ steps.migration.outputs.migration_file }}
          if-no-files-found: error
          retention-days: 7
